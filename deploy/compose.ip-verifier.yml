# Trusted host-side verifier coordinator. It starts before the console and
# creates only network-disabled, resource-bounded Chromium workers. The Docker
# socket is a host-level privilege: never connect this service to public ports
# or run generated page bytes in this process. Attach only the console and this
# service to ATOM_VERIFIER_NETWORK; it must be separate from Caddy's bridge.
name: atom-ip-verifier

services:
  atom-verifier:
    image: ${ATOM_PUBLICATION_IMAGE:?set the exact tested application image ID}
    working_dir: /app/backend
    env_file:
      - path: ${ATOM_STORAGE_ENV_FILE:?set the root-private storage environment path}
        required: true
      - path: ${ATOM_VERIFIER_ENV_FILE:?set the root-private verifier control environment path}
        required: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      ATOM_VERIFIER_DB_PATH: /data/atom.db
      ATOM_VERIFIER_ARTIFACT_DIR: /data/artifacts
      ATOM_VERIFIER_IMAGE: ${ATOM_VERIFIER_WORKER_IMAGE:?set the exact tested worker image ID}
      ATOM_VERIFIER_SECCOMP_PATH: ${ATOM_VERIFIER_POLICY_PATH:?set the absolute host policy path}
      ATOM_VERIFIER_ID: ${ATOM_VERIFIER_ID:?set the durable verifier identity}
    volumes:
      - type: bind
        source: ${ATOM_DATA_BIND:?set the protected Atom data directory}
        target: /data
      - type: bind
        source: ${ATOM_VERIFIER_POLICY_PATH:?set the absolute host policy path}
        target: ${ATOM_VERIFIER_POLICY_PATH:?set the absolute host policy path}
        read_only: true
      - type: bind
        source: ${ATOM_DOCKER_CLI_PATH:?set the exact host Docker CLI path}
        target: /usr/bin/docker
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 384m
    init: true
    restart: unless-stopped
    stop_grace_period: 75s
    expose:
      - "8765"
    command:
      - /app/backend/.venv/bin/uvicorn
      - app.verifier_service:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --no-access-log
    healthcheck:
      test:
        - CMD
        - /app/backend/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2).close()"
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  private:
    external: true
    name: ${ATOM_VERIFIER_NETWORK:?set the dedicated console-verifier bridge}
