services:
  atom:
    build:
      context: .
      args:
        VITE_BASE: ${VITE_BASE:-/}
        APT_MIRROR: ${APT_MIRROR:-}
        PYPI_INDEX: ${PYPI_INDEX:-}
    image: atom-demo:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "${ATOM_HTTP_PORT:-80}:80"
    volumes:
      - atom-data:/data
    # The agent writes files and runs shell commands inside per-project
    # workspaces, so give it a writable /data and a bounded tmp.
    tmpfs:
      - /tmp:size=512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  atom-data:
